<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <main class="page">
        <header class="hero">
            <h1>Previsão do Tempo</h1>
            <p>Previsão em tempo real para as principais cidades e busca por cidades do Brasil.</p>
        </header>

        <section class="search-panel">
            <form id="search-form">
                <input id="search-city" type="text" placeholder="Digite uma cidade do Brasil" />
                <input id="search-state" type="text" placeholder="Estado (sigla ou nome)" />
                <button type="submit">Buscar</button>
            </form>
            <div id="search-result" class="search-result"></div>
        </section>

        <section id="city-grid" class="city-grid">
            <div class="loader">Carregando previsões...</div>
        </section>
    </main>

    <script>
        const cityGrid = document.getElementById("city-grid");
        const searchForm = document.getElementById("search-form");
        const searchResult = document.getElementById("search-result");

        function createCard(item) {
            const card = document.createElement("article");
            card.className = "card";
            card.innerHTML = `
                <h2>${item.cidade}</h2>
                <p class="desc">${item.descricao || "Sem dados"}</p>
                <div class="metrics">
                    <span>🌡 ${item.temperatura ?? "--"} °C</span>
                    <span>🌬 ${item.vento_kmph ?? "--"} km/h</span>
                    <span>💧 ${item.umidade ?? "--"}%</span>
                </div>
                <div class="footer">
                    <span>Sensação: ${item.sensacao_termica ?? "--"} °C</span>
                    ${item.erro ? `<p class="error">${item.erro}</p>` : ""}
                </div>`;
            return card;
        }

        async function loadWeather() {
            try {
                const response = await fetch("/api/weather/goias");
                const data = await response.json();
                cityGrid.innerHTML = "";
                if (!Array.isArray(data)) {
                    cityGrid.innerHTML = `<div class="error">Erro: ${data.erro || "Resposta inválida"}</div>`;
                    return;
                }
                data.forEach(item => cityGrid.appendChild(createCard(item)));
            } catch (err) {
                cityGrid.innerHTML = `<div class="error">Não foi possível carregar as previsões.</div>`;
            }
        }

        async function searchCity(city, state) {
            searchResult.innerHTML = `<div class="loader">Buscando ${city}${state ? ", " + state : ""}...</div>`;
            try {
                const response = await fetch(`/api/weather?city=${encodeURIComponent(city)}&state=${encodeURIComponent(state)}`);
                const data = await response.json();
                searchResult.innerHTML = "";
                if (data.erro) {
                    searchResult.innerHTML = `<div class="error">${data.erro}</div>`;
                    return;
                }
                searchResult.appendChild(createCard(data));
            } catch (err) {
                searchResult.innerHTML = `<div class="error">Erro ao buscar a cidade.</div>`;
            }
        }

        searchForm.addEventListener("submit", event => {
            event.preventDefault();
            const city = document.getElementById("search-city").value.trim();
            const state = document.getElementById("search-state").value.trim();
            if (!city) {
                searchResult.innerHTML = `<div class="error">Digite o nome de uma cidade.</div>`;
                return;
            }
            searchCity(city, state);
        });

        window.addEventListener("DOMContentLoaded", loadWeather);
    </script>
</body>
</html>
