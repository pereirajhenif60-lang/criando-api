<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Agenda - Gerenciador de Eventos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 API AGENDA</h1>
            <p>Gerenciador Avançado de Eventos e Compromissos</p>
        </header>

        <div class="main-grid">
            <!-- Formulário -->
            <div class="card">
                <h2>✏️ Novo Evento</h2>
                <div id="alerta"></div>
                
                <form id="formEvento">
                    <div class="form-group">
                        <label for="titulo">Título *</label>
                        <input type="text" id="titulo" name="titulo" required placeholder="Digite o título do evento">
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" placeholder="Detalhes do evento"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="data_inicio">Data e Hora Início *</label>
                        <input type="datetime-local" id="data_inicio" name="data_inicio" required>
                    </div>

                    <div class="form-group">
                        <label for="data_fim">Data e Hora Fim</label>
                        <input type="datetime-local" id="data_fim" name="data_fim">
                    </div>

                    <div class="form-group">
                        <label for="local">Local</label>
                        <input type="text" id="local" name="local" placeholder="Onde o evento acontecerá?">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria">
                            <option value="">Selecione uma categoria</option>
                            <option value="trabalho">Trabalho</option>
                            <option value="pessoal">Pessoal</option>
                            <option value="reuniao">Reunião</option>
                            <option value="lazer">Lazer</option>
                            <option value="saude">Saúde</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade" name="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="normal" selected>Normal</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <button type="submit">➕ Criar Evento</button>
                    <button type="button" class="secondary" onclick="limparFormulario()">🔄 Limpar</button>
                </form>
            </div>

            <!-- Lista de Eventos -->
            <div class="card">
                <h2>📋 Eventos</h2>
                
                <div class="filtros">
                    <select id="filtroCategoria" onchange="aplicarFiltros()">
                        <option value="">Todas as categorias</option>
                        <option value="trabalho">Trabalho</option>
                        <option value="pessoal">Pessoal</option>
                        <option value="reuniao">Reunião</option>
                        <option value="lazer">Lazer</option>
                        <option value="saude">Saúde</option>
                    </select>

                    <select id="filtroPrioridade" onchange="aplicarFiltros()">
                        <option value="">Todas as prioridades</option>
                        <option value="alta">Alta</option>
                        <option value="normal">Normal</option>
                        <option value="baixa">Baixa</option>
                    </select>
                </div>

                <button type="button" onclick="carregarEventos()" class="secondary">🔄 Recarregar</button>

                <div class="eventos-lista scrollbar" id="eventosList">
                    <p style="color: #999; text-align: center; padding: 20px;">Nenhum evento criado ainda...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div class="modal-overlay" id="modalEdicao">
        <div class="modal">
            <h2>✏️ Editar Evento</h2>
            <div class="info-edicio">Use Enter para passar para o próximo campo</div>
            
            <form id="formEdicao">
                <div class="form-group">
                    <label for="edit_titulo">Título *</label>
                    <input type="text" id="edit_titulo" required placeholder="Digite o título do evento">
                </div>

                <div class="form-group">
                    <label for="edit_descricao">Descrição</label>
                    <textarea id="edit_descricao" placeholder="Detalhes do evento"></textarea>
                </div>

                <div class="form-group">
                    <label for="edit_data_inicio">Data e Hora Início *</label>
                    <input type="datetime-local" id="edit_data_inicio" required>
                </div>

                <div class="form-group">
                    <label for="edit_data_fim">Data e Hora Fim</label>
                    <input type="datetime-local" id="edit_data_fim">
                </div>

                <div class="form-group">
                    <label for="edit_local">Local</label>
                    <input type="text" id="edit_local" placeholder="Onde o evento acontecerá?">
                </div>

                <div class="form-group">
                    <label for="edit_categoria">Categoria</label>
                    <select id="edit_categoria">
                        <option value="">Selecione uma categoria</option>
                        <option value="trabalho">Trabalho</option>
                        <option value="pessoal">Pessoal</option>
                        <option value="reuniao">Reunião</option>
                        <option value="lazer">Lazer</option>
                        <option value="saude">Saúde</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit_prioridade">Prioridade</label>
                    <select id="edit_prioridade">
                        <option value="baixa">Baixa</option>
                        <option value="normal">Normal</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>

                <button type="submit">💾 Salvar Alterações</button>
                <button type="button" class="cancel" onclick="fecharModal()">❌ Cancelar</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
